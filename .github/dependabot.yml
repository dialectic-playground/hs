# Keeps GitHub Actions (SHA-pinned) and the toolchain image digest current.
# Dependabot does not support cabal (Haskell), so project dependencies are pinned by each
# project's cabal.project.freeze and updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The release line (GHC 9.14) is a deliberate choice shared with the native CI and
    # `make toolchain`; Dependabot refreshes digests but never changes minor or major versions.
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # Hook revisions in .pre-commit-config.yaml (enforced by the pre-commit CI job).
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: ci
