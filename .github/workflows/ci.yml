# CI for dialectic-playground/hs (Haskell), from the curriculum's CI template
# (sdlc-curriculum/shared/ci/cross-platform-ci.yml).
#
# Every job runs the repository's make targets, so CI needs no edits as projects are
# implemented: `make check` covers the repository, the toolchain versions, and every
# project listed in IMPLEMENTED in the root Makefile.
# - Container (podman): `make check` in the toolchain image (./Containerfile), on Linux.
# - Native (Linux, macOS, Windows): `make check roundtrip` with DP_RUNTIME=local;
#   toolchain: haskell-actions/setup (GHC 9.14.1, latest cabal), plus hlint and ormolu
#   (pinned prebuilt release binaries, as in the Containerfile).
# - Shared tooling, DCO, and the required "CI result" check, as in every repository.
#
# Actions are pinned to full commit SHAs (organization policy); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run catches toolchain and runner drift even when nothing changes here.
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  container:
    name: Container (podman)
    runs-on: ubuntu-latest
    env:
      DP_RUNTIME: podman
    steps:
      - name: Check out repository (with curriculum submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Show toolchain environment
        run: make dp-info

      - name: make check
        run: make check

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15, not macos-latest: on runner images with the macOS 27 SDK, the linker GHC
        # uses rejects the SDK's .tbd stubs ("unknown architecture arm64e.x1"). Return to
        # macos-latest once GHC or the runner image handles them.
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DP_RUNTIME: local
    defaults:
      run:
        # Git Bash on Windows, so the Makefile's POSIX recipes behave identically everywhere.
        shell: bash
    steps:
      - name: Check out repository (with curriculum submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python (black-box test runner)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Ensure GNU Make is available
        if: runner.os == 'Windows'
        run: command -v make || choco install make --no-progress -y

      # macOS ships GNU Make 3.81; BASE-MAKEFILE requires >= 3.82.
      - name: Use current GNU Make (macOS)
        if: runner.os == 'macOS'
        run: brew install make && echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # GHC 9.14.1, the container image's version: cabal.project.freeze pins its boot packages.
      - name: Set up GHC 9.14 and cabal
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: "9.14.1"
          cabal-version: latest

      # The same pinned prebuilt release binaries as the Containerfile, verified by SHA-256.
      # hlint publishes x86_64 binaries only; macOS arm64 runs them under Rosetta 2.
      - name: Install hlint and ormolu (pinned, SHA-256 verified)
        env:
          HLINT_VERSION: "3.10"
          ORMOLU_VERSION: "0.9.0.0"
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              hlint_asset=x86_64-linux.tar.gz; hlint_sha=ccabc8802a58154699a3583b8dddc5ea2e6d65753a62c45c0e80088ebb16b42b
              ormolu_asset=x86_64-linux; ormolu_sha=367eb4969986504cf171f71f91e24ea5d7d9d97c41701e8e6eef9b642fd0d201 ;;
            macOS-ARM64)
              hlint_asset=x86_64-osx.tar.gz; hlint_sha=7a3d208fb117999336b35a32a68c476f95e22e232357fea5862250f14493cae5
              ormolu_asset=aarch64-darwin; ormolu_sha=39efe03a0f41385bd5a1a7f874acf195fb5f6d09673be96a24f708508bb86a20 ;;
            macOS-X64)
              hlint_asset=x86_64-osx.tar.gz; hlint_sha=7a3d208fb117999336b35a32a68c476f95e22e232357fea5862250f14493cae5
              ormolu_asset=x86_64-darwin; ormolu_sha=6d098117122b10d26c0a2976beeb729b322a23825789b7f1817541dc6041ab19 ;;
            Windows-X64)
              hlint_asset=x86_64-windows.zip; hlint_sha=9dc50b66771920464910472c5ae2b8eb83d33d4eadebe6d99bf512452ca22a20
              ormolu_asset=x86_64-windows; ormolu_sha=afcde0c0a9bace9c8ae9bd98d027620b2901947670dfc54f63fa44c221d5b19d ;;
            *) echo "::error::no prebuilt hlint/ormolu for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/dp-hs-lint"
          mkdir -p "$dir"
          curl -fsSLo "$dir/hlint-archive" \
            "https://github.com/ndmitchell/hlint/releases/download/v$HLINT_VERSION/hlint-$HLINT_VERSION-$hlint_asset"
          curl -fsSLo "$dir/ormolu.zip" \
            "https://github.com/tweag/ormolu/releases/download/$ORMOLU_VERSION/ormolu-$ormolu_asset.zip"
          python - "$dir" "$hlint_sha" "$ormolu_sha" <<'EOF'
          import hashlib, os, pathlib, stat, sys, tarfile, zipfile
          root, hlint_sha, ormolu_sha = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          for name, expected in (("hlint-archive", hlint_sha), ("ormolu.zip", ormolu_sha)):
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != expected:
                  sys.exit(f"{name}: SHA-256 {actual}, expected {expected}")
          hlint = root / "hlint-archive"
          if zipfile.is_zipfile(hlint):
              zipfile.ZipFile(hlint).extractall(root / "hlint")
          else:
              with tarfile.open(hlint) as archive:
                  archive.extractall(root / "hlint", filter="data")
          zipfile.ZipFile(root / "ormolu.zip").extractall(root / "ormolu")
          for exe in [*root.glob("hlint/*/hlint"), root / "ormolu" / "ormolu"]:
              if exe.exists():
                  exe.chmod(exe.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path:
              path.write(f"{next(root.glob('hlint/hlint-*'))}\n{root / 'ormolu'}\n")
          EOF

      - name: make check roundtrip
        run: make check roundtrip

  shared-tooling:
    name: Shared tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tools/dp-run and tools/container.mk match the canonical copies
        run: |
          status=0
          for file in tools/dp-run tools/container.mk; do
            curl -fsSL "https://raw.githubusercontent.com/dialectic-playground/.github/main/$file" \
              | diff -u - "$file" \
              || { echo "::error::$file differs from the canonical copy in dialectic-playground/.github"; status=1; }
          done
          exit "$status"

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$commit")"
            case "$author" in *"[bot]@users.noreply.github.com>") continue ;; esac
            if ! git log -1 --format=%B "$commit" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $commit is missing 'Signed-off-by: $author' (use git commit -s)"
              status=1
            fi
          done
          exit "$status"

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # no-commit-to-branch guards local commits to main; CI legitimately runs on main.
      # workspace-lint runs make lint, which the container and native jobs already run.
      - name: Run every hook on all files
        env:
          SKIP: no-commit-to-branch,workspace-lint
        run: |
          python -m pip install --disable-pip-version-check pre-commit==4.7.0
          pre-commit run --all-files --show-diff-on-failure --color always

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The title becomes the squash commit on main, so it must be a Conventional Commit.
      # The title reaches the script only through the environment, never as code.
      - name: Require a Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/,-]+\))?!?: [^ ].*'
          if printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR title is a Conventional Commit: $TITLE"
          else
            echo "::error::PR title is not a Conventional Commit: $TITLE"
            echo "Use '<type>[(scope)][!]: <description>', where type is one of build, chore, ci,"
            echo "docs, feat, fix, perf, refactor, revert, style, or test."
            exit 1
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Block newly added dependencies with known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ci-result:
    name: CI result
    if: always()
    needs:
      - container
      - native
      - shared-tooling
      - dco
      - pre-commit
      - pr-title
      - dependency-review
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      # Matrix jobs report one combined result to `needs`, which can hide a cancelled leg
      # (for example a runner that never started). Check every job of this run attempt.
      - name: Require every job in this run to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          IGNORED_JOBS: "CI result"
        run: |
          jobs=$(gh api "$JOBS_URL" --paginate --jq '.jobs[] | "\(.name)\t\(.conclusion)"')
          printf '%s\n' "$jobs"
          bad=$(printf '%s\n' "$jobs" | awk -F '\t' -v ignored="$IGNORED_JOBS" '
            BEGIN { n = split(ignored, list, "|"); for (i = 1; i <= n; i++) skip[list[i]] = 1 }
            $1 in skip { next }
            ($1 == "DCO" || $1 == "PR title" || $1 == "Dependency review") && $2 == "skipped" { next }
            $2 != "success" { print }')
          if [ -n "$bad" ]; then
            echo "::error::Not every job succeeded:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All jobs in this run succeeded."
